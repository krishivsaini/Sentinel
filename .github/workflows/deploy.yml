# Deploy the API to Cloud Run (deploy/terraform creates everything this needs).
#
# Manual only: a deploy is a deliberate act, and main isn't gated by CI on push. GitHub's OIDC
# token is exchanged for the deployer service account through Workload Identity Federation, so
# no cloud credential is stored anywhere — the provider only accepts tokens from this
# repository's main branch. The image is built here (linux/amd64, as Cloud Run runs it) and
# tagged with the commit; the rollout then waits for a live /healthz.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables), from
# `terraform output github_variables`: GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOYER_SA.

name: deploy

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # to request the OIDC token GCP exchanges

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.ref == 'refs/heads/main'
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sentinel/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Let Docker push to Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      # Layer cache in GitHub's cache: dependencies and the built index rebuild only when their
      # inputs change.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: sentinel-api
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors "$URL/healthz"
          echo "### Deployed \`${GITHUB_SHA::7}\` → $URL" >> "$GITHUB_STEP_SUMMARY"
