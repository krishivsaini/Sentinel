# Quality and safety gates (§13, v2-R5).
#
# On every PR to main, three checks run against indexes built from the committed corpus:
#   tests              the full pytest suite (hermetic; retrieval tests use the real indexes)
#   faithfulness-gate  a Ragas faithfulness eval over half the ground truth; fails below
#                      config.faithfulness_threshold, if too few items score (config.ci_min_items),
#                      or if it falls more than the regression margin below main's per-question
#                      baseline (data/faithfulness_baseline.json, always read from main)
#   injection-gate     the 50 poisoned-document attacks and the 35 attacks in the user's own question
#                      run through the full pipeline with every defence on; fails if either set's
#                      success rate exceeds config.injection_asr_threshold
# Both gates write a Markdown summary into the PR's checks (FR-CI3). The full three-metric eval
# and the full guardrail report run locally (sentinel.eval.run_eval, sentinel.eval.run_guardrails).
#
# Jobs run only when the PR touches something that can change their result (the `changes` job):
# README, docs, dashboard, scripts and regenerated reports skip everything, and only code and the
# data the gates read trigger the two gates — the only jobs that call the paid API. A skipped job
# counts as passing. Manual runs (workflow_dispatch) always run everything.
#
# Requires the GROQ_API_KEY repository secret (FR-CI4); the repo's key is on Groq's paid tier.
# Injection-screening verdicts for the corpus are committed (data/guardrails/screening_cache.jsonl),
# so building the indexes makes no API calls unless the corpus or the screening policy changed.

name: eval-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gates: ${{ steps.paths.outputs.gates }}
      tests: ${{ steps.paths.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "gates=true" >> "$GITHUB_OUTPUT"; echo "tests=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "changed files:"; echo "$files"
          # What the gates read: the package, dependencies, this workflow, and the eval data — the
          # corpus, ground truth, attack sets, screening verdicts and labels. Not reports or docs.
          gates='^(sentinel/|pyproject\.toml$|uv\.lock$|\.github/workflows/eval-gate\.yml$|data/(corpus/|corpus_manifest\.json$|ground_truth\.jsonl$|adversarial/|guardrails/(screening_cache|user_prompts|pii_labels)\.jsonl$))'
          if echo "$files" | grep -qE "$gates"; then g=true; else g=false; fi
          if [ "$g" = true ] || echo "$files" | grep -qE '^tests/'; then t=true; else t=false; fi
          echo "gates=$g" >> "$GITHUB_OUTPUT"; echo "tests=$t" >> "$GITHUB_OUTPUT"
          echo "gates=$g tests=$t"

  indexes:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The cache keys are computed once here and handed to the other jobs, so all four use the
    # identical key (hashFiles needs the checked-out workspace, so it can't live in workflow env).
    outputs:
      index_key: ${{ steps.keys.outputs.index }}
      hf_key: ${{ steps.keys.outputs.hf }}
    steps:
      - uses: actions/checkout@v4
      # Everything that determines the indexes' contents: corpus, adversarial corpus, chunking and
      # embedding code, schema, config, and the injection screening policy and its verdicts.
      - id: keys
        run: |
          echo "index=indexes-${{ hashFiles('data/corpus/**', 'data/adversarial/**', 'data/guardrails/screening_cache.jsonl', 'sentinel/ingest.py', 'sentinel/schema.py', 'sentinel/config.py', 'sentinel/guardrails/injection.py') }}" >> "$GITHUB_OUTPUT"
          echo "hf=hf-models-${{ hashFiles('sentinel/config.py') }}" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.keys.outputs.hf }}
      # Indexes are gitignored (rebuilt from source, §16.6). The service index embeds the whole
      # corpus on CPU (~9 min); the adversarial index copies it and embeds only 50 passages.
      - name: Cache indexes
        id: index-cache
        uses: actions/cache@v4
        with:
          path: |
            indexes
            indexes_adversarial
          key: ${{ steps.keys.outputs.index }}
      - name: Build indexes
        if: steps.index-cache.outputs.cache-hit != 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # only used for chunks not already screened
        run: |
          uv run python -m sentinel.ingest
          uv run python -m sentinel.ingest --adversarial

  tests:
    needs: [changes, indexes]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ needs.indexes.outputs.hf_key }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            indexes
            indexes_adversarial
          key: ${{ needs.indexes.outputs.index_key }}
          fail-on-cache-miss: true
      - run: uv run pytest -q

  faithfulness-gate:
    needs: [changes, indexes]
    if: needs.changes.outputs.gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ needs.indexes.outputs.hf_key }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            indexes
            indexes_adversarial
          key: ${{ needs.indexes.outputs.index_key }}
          fail-on-cache-miss: true
      # The relative gate compares against main's baseline. Take it from the PR's base commit,
      # so a PR can't pass itself by editing the file; no baseline there -> absolute gate only.
      - name: Use main's faithfulness baseline
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE"
          git show "$BASE:data/faithfulness_baseline.json" > data/faithfulness_baseline.json \
            || rm -f data/faithfulness_baseline.json
      # --ci scores faithfulness only over config.ci_eval_subset_size items, through the same
      # guardrails the service applies, and exits non-zero below the gate.
      - name: Faithfulness gate (eval subset)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run python -m sentinel.eval.run_eval --ci --no-resume

  injection-gate:
    needs: [changes, indexes]
    if: needs.changes.outputs.gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ needs.indexes.outputs.hf_key }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            indexes
            indexes_adversarial
          key: ${{ needs.indexes.outputs.index_key }}
          fail-on-cache-miss: true
      - name: Injection gate (85 attacks across both surfaces, every defence on)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run python -m sentinel.eval.run_guardrails --ci
