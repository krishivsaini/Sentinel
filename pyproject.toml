[project]
name = "sentinel"
version = "0.1.0"
description = "Production hybrid-retrieval RAG service with a Ragas evaluation gate wired into CI."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Krishiv Saini" }]

# Version floors reflect the current PyPI releases verified 2026-07-06.
# uv pins exact versions in uv.lock (committed) — that is the reproducibility contract.
dependencies = [
    # --- Retrieval orchestration (the deliberate framework choice) ---
    "langchain>=1.3,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-huggingface>=1.2,<2",      # HF embedding integration for LangChain retrievers
    # --- Generation + Ragas judge (free-tier LLM calls) ---
    # NVIDIA build.nvidia.com powers product generation + the Ragas judge by default: its
    # OpenAI-compatible free tier gives each model its own 40 RPM pool (vs. Groq's one shared
    # pool across roles) and hosts judges far larger than Groq's free-tier ceiling.
    "langchain-openai>=1.1,<2",            # build.nvidia.com's OpenAI-compatible endpoint
    "langchain-groq>=1.1,<2",              # kept as an alternate provider (see sentinel/llm.py)
    "langchain-google-genai>=4.2,<5",     # kept as an alternate provider (see sentinel/llm.py)
    # --- Local models: embeddings + cross-encoder reranker (run at ₹0) ---
    "sentence-transformers>=5.6,<6",
    # Declared directly (it comes in via sentence-transformers) so the CPU-only index below
    # applies to it; pinned to the series every published number was measured on.
    "torch>=2.12,<2.13",
    # --- Indexes ---
    "faiss-cpu>=1.14,<2",                  # dense vector index
    "rank-bm25>=0.2.2,<0.3",               # sparse BM25 index
    # --- Evaluation ---
    "ragas>=0.4.3,<0.5",
    "datasets>=5.0,<6",                    # ragas dataset plumbing
    # --- API service (production hygiene) ---
    "fastapi>=0.139,<0.140",
    "uvicorn[standard]>=0.50,<0.51",
    "sse-starlette>=2.1",                  # SSE token streaming for /query
    "python-jose[cryptography]>=3.5,<4",   # JWT auth
    "python-multipart>=0.0.9",             # form parsing for the token endpoint
    "slowapi>=0.1.10,<0.2",                # per-IP rate limiting
    "redis>=8.1,<9",                       # optional shared semantic cache (cache_backend=redis)
    # --- Cross-cutting ---
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",          # config.py loads secrets/knobs from env
    "tenacity>=9.1,<10",                   # backoff around Gemini/Ragas judge (429s)
    "tiktoken>=0.8",                       # approximate token counting for chunking
    "structlog>=25.1",                     # structured logging + per-stage latency
    "numpy>=2.0",
    "httpx>=0.28",                         # guardrail classifiers (Groq REST, sentinel.guardrails)
    "spacy>=3.8,<3.9",
    "en-core-web-sm",
]

[project.optional-dependencies]
# Dense search in Postgres (sentinel/vectorstore.py), local only: `uv sync --extra pgvector`.
# The production image doesn't install it and keeps FAISS.
pgvector = [
    "pgvector>=0.4,<0.5",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",                          # FastAPI TestClient / async API tests
    "ruff>=0.9",
]

# PyTorch from its CPU-only index on Linux. The PyPI wheel pulls ~3 GB of CUDA libraries the
# service never uses (local models run on CPU), which bloats the container and every CI install.
# macOS keeps the PyPI wheel, which is already CPU/MPS-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to sit in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# The warning filters must be installed before ragas is imported, so its imports come after them.
"sentinel/eval/run_eval.py" = ["E402"]
